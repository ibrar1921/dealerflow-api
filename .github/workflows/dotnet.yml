name: Build & API tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore tests/DealerFlow.Tests/DealerFlow.Tests.csproj
      - run: dotnet build tests/DealerFlow.Tests/DealerFlow.Tests.csproj --configuration Release --no-restore
      - run: dotnet test tests/DealerFlow.Tests/DealerFlow.Tests.csproj --configuration Release --no-build --verbosity normal
